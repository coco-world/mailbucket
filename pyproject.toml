[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mailbucket"
version = "0.1.0"
description = "Local email archive search and chronological PDF export"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["nicegui>=3.0,<4", "reportlab>=4.2,<5", "pypdf>=6,<7", "beautifulsoup4>=4.12,<5", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "httpx>=0.27"]
outlook = ["extract-msg>=0.54,<1"]

[project.scripts]
mailbucket = "mailbucket.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailbucket = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
